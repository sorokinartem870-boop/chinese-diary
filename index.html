<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Школьный Бот — Дневник</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #e7ebf0;
      --chat-bg: #dbe3ec;
      --bot-msg: #ffffff;
      --user-msg: #effdde;
      --text: #181a1f;
      --muted: #687382;
      --accent: #2481cc;
      --inline-bg: rgba(36, 129, 204, 0.11);
      --inline-text: #1b6eb2;
      --panel: #ffffff;
      --border: #d5dce4;
      --ai-grad: linear-gradient(135deg, #7c3aed 0%, #db2777 100%);
    }
    body.dark {
      --bg: #0e1621;
      --chat-bg: #0e1621;
      --bot-msg: #182533;
      --user-msg: #2b5278;
      --text: #f5f5f5;
      --muted: #8a9ba8;
      --accent: #52a8ec;
      --inline-bg: rgba(82, 168, 236, 0.16);
      --inline-text: #7cc0f8;
      --panel: #17212b;
      --border: #232e3c;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: var(--chat-bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Шапка как в Telegram */
    header {
      background: var(--panel); border-bottom: 1px solid var(--border);
      padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
      z-index: 10; flex-shrink: 0;
    }
    .bot-info { display: flex; align-items: center; gap: 10px; }
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      background: linear-gradient(135deg, #2481cc, #4f46e5);
      color: #fff; display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700;
    }
    .bot-title { font-weight: 700; font-size: 15px; }
    .bot-status { font-size: 12px; color: var(--accent); }
    .role-pill {
      font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 12px;
      background: var(--inline-bg); color: var(--inline-text);
    }

    /* Лента чата */
    #chatFeed {
      flex: 1; overflow-y: auto; padding: 12px 12px 18px;
      display: flex; flex-direction: column; gap: 10px;
    }
    .msg-wrap { display: flex; flex-direction: column; max-width: 88%; animation: fadeIn 0.18s ease; }
    .msg-wrap.bot { align-self: flex-start; }
    .msg-wrap.user { align-self: flex-end; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .bubble {
      padding: 10px 13px; border-radius: 16px; font-size: 14px; line-height: 1.42;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08); word-wrap: break-word;
    }
    .bot .bubble { background: var(--bot-msg); border-bottom-left-radius: 4px; }
    .user .bubble { background: var(--user-msg); border-bottom-right-radius: 4px; }
    .msg-time { font-size: 10px; color: var(--muted); text-align: right; margin-top: 4px; }

    /* Inline-кнопки под сообщением бота */
    .inline-kb { display: flex; flex-direction: column; gap: 5px; margin-top: 5px; }
    .inline-row { display: flex; gap: 5px; }
    .inline-btn {
      flex: 1; background: var(--bot-msg); color: var(--inline-text);
      border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px;
      font-size: 13px; font-weight: 600; cursor: pointer; text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .inline-btn:active { opacity: 0.7; }
    .inline-btn.ai { background: var(--ai-grad); color: #fff; border: none; }
    .inline-btn.correct { background: #16a34a; color: #fff; border-color: #16a34a; }
    .inline-btn.wrong { background: #dc2626; color: #fff; border-color: #dc2626; }

    /* Формы внутри пузыря */
    .bot-form input, .bot-form select, .bot-form textarea {
      width: 100%; padding: 9px 10px; border-radius: 10px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); margin-top: 6px; font-size: 13px; outline: none;
    }

    /* Нижняя клавиатура команд (Reply Keyboard) */
    .bottom-dock {
      background: var(--panel); border-top: 1px solid var(--border);
      padding: 8px 10px 12px; flex-shrink: 0;
    }
    .input-bar { display: flex; gap: 8px; margin-bottom: 8px; }
    .input-bar input {
      flex: 1; padding: 9px 14px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 14px; outline: none;
    }
    .send-btn {
      width: 38px; height: 38px; border-radius: 50%; border: none;
      background: var(--accent); color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .reply-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px;
    }
    .reply-btn {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 10px; padding: 9px 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; text-align: center;
    }
    .reply-btn:active { background: var(--inline-bg); }
    .reply-btn.span2 { grid-column: span 2; }
  </style>
</head>
<body>
  <header>
    <div class="bot-info">
      <div class="avatar">📘</div>
      <div>
        <div class="bot-title">Школьный Дневник</div>
        <div class="bot-status" id="syncStatus">бот • в сети</div>
      </div>
    </div>
    <span class="role-pill" id="roleBadge">Ученик</span>
  </header>

  <div id="chatFeed"></div>

  <div class="bottom-dock">
    <div class="input-bar">
      <input id="chatInput" placeholder="Напишите команду или тему для теста..." onkeydown="if(event.key==='Enter') handleFreeText()" />
      <button class="send-btn" onclick="handleFreeText()">➤</button>
    </div>
    <div class="reply-grid" id="replyKeyboard">
      <button class="reply-btn" onclick="cmdSchedule()">📅 Расписание и ДЗ</button>
      <button class="reply-btn" onclick="cmdGrades()">📊 Оценки</button>
      <button class="reply-btn" onclick="cmdTests()">📝 Тесты (ИИ)</button>
      <button class="reply-btn" onclick="cmdSubmitHW()">📤 Сдать ДЗ</button>
      <button class="reply-btn" onclick="cmdSkip()">⚠️ Пропуск урока</button>
      <button class="reply-btn" onclick="cmdTeacher()">🎓 Режим учителя</button>
    </div>
  </div>

  <script>
    const DB_URL = "https://chinese-diary-1ea47-default-rtdb.firebaseio.com";
    const BOT_TOKEN = "9227625709:AAEEV7aCPq3vW_mb7GmAVi_hpEOQuOFSuDQ";
    const TEACHER_PIN = "43415";

    const tg = window.Telegram && window.Telegram.WebApp;
    let currentTgUserId = null;
    let userName = "Ученик";

    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.colorScheme === 'dark') document.body.classList.add('dark');
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        const u = tg.initDataUnsafe.user;
        currentTgUserId = u.id;
        userName = [u.first_name, u.last_name].filter(Boolean).join(' ');
      }
    }

    let db = { lessons: [], grades: [], tests: [], submissions: [], teacherChatId: null };
    let isTeacher = false;
    let selectedClass = "7";

    function nowTime() {
      return new Date().toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    }

    function scrollToBottom() {
      const feed = document.getElementById('chatFeed');
      setTimeout(() => { feed.scrollTop = feed.scrollHeight; }, 40);
    }

    function addUserMsg(text) {
      const feed = document.getElementById('chatFeed');
      const div = document.createElement('div');
      div.className = 'msg-wrap user';
      div.innerHTML = `<div class="bubble">${text}<div class="msg-time">${nowTime()}</div></div>`;
      feed.appendChild(div);
      scrollToBottom();
    }

    function addBotMsg(html, inlineRows = []) {
      const feed = document.getElementById('chatFeed');
      const div = document.createElement('div');
      div.className = 'msg-wrap bot';
      let kbHtml = '';
      if (inlineRows.length) {
        kbHtml = '<div class="inline-kb">' + inlineRows.map(row =>
          '<div class="inline-row">' + row.map(btn =>
            `<button class="inline-btn ${btn.cls || ''}" onclick="${btn.action}">${btn.label}</button>`
          ).join('') + '</div>'
        ).join('') + '</div>';
      }
      div.innerHTML = `<div class="bubble">${html}<div class="msg-time">${nowTime()}</div></div>${kbHtml}`;
      feed.appendChild(div);
      scrollToBottom();
      return div;
    }

    async function loadCloudDB() {
      document.getElementById('syncStatus').innerText = 'обновление...';
      try {
        const res = await fetch(`${DB_URL}/diary.json`);
        const data = await res.json();
        if (data) {
          db.lessons = data.lessons || [];
          db.grades = data.grades || [];
          db.tests = data.tests || [];
          db.submissions = data.submissions || [];
          db.teacherChatId = data.teacherChatId || null;
        }
        document.getElementById('syncStatus').innerText = 'бот • в сети';
      } catch (e) {
        document.getElementById('syncStatus').innerText = 'ошибка сети';
      }
    }

    async function saveCloudDB() {
      await fetch(`${DB_URL}/diary.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(db)
      });
    }

    async function notifyTeacher(text) {
      if (!db.teacherChatId) return;
      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: db.teacherChatId, text })
        });
      } catch (e) {}
    }

    // --- КОМАНДЫ БОТА ---
    async function cmdStart() {
      await loadCloudDB();
      addBotMsg(
        `Привет, <b>${userName}</b>! 👋<br>Я твой школьный дневник. Выбери нужное действие на клавиатуре ниже или нажми кнопку под сообщением:`,
        [
          [{ label: '📅 Расписание и ДЗ', action: 'cmdSchedule()' }, { label: '📝 Тесты с ИИ', action: 'cmdTests()' }],
          [{ label: '📤 Сдать ДЗ', action: 'cmdSubmitHW()' }, { label: '🎓 Я учитель', action: 'cmdTeacher()' }]
        ]
      );
    }

    async function cmdSchedule() {
      addUserMsg('📅 Расписание и ДЗ');
      await loadCloudDB();
      addBotMsg(
        `Выбери свой класс (сейчас выбран: <b>${selectedClass} класс</b>):`,
        [
          [
            { label: '5 кл', action: "showClassLessons('5')" },
            { label: '6 кл', action: "showClassLessons('6')" },
            { label: '7 кл', action: "showClassLessons('7')" },
            { label: '8 кл', action: "showClassLessons('8')" }
          ],
          [
            { label: '9 кл', action: "showClassLessons('9')" },
            { label: '10 кл', action: "showClassLessons('10')" },
            { label: '11 кл', action: "showClassLessons('11')" }
          ]
        ]
      );
    }

    function showClassLessons(cls) {
      selectedClass = cls;
      addUserMsg(`${cls} класс`);
      const items = db.lessons.map((l, idx) => ({ ...l, idx })).filter(l => l.cls === cls);
      if (!items.length) {
        addBotMsg(`Для <b>${cls} класса</b> уроков пока не добавлено.`);
        return;
      }
      const text = items.map(l =>
        `📌 <b>${l.day}</b> ${l.time ? `(${l.time})` : ''}<br>📖 <b>${l.topic}</b><br>📚 ДЗ: ${l.task}`
      ).join('<br><br>');
      const delBtns = isTeacher
        ? items.map(l => [{ label: `🗑 Удалить: ${l.topic}`, action: `deleteLesson(${l.idx})` }])
        : [];
      addBotMsg(`<b>Расписание и ДЗ для ${cls} класса:</b><br><br>${text}`, delBtns);
    }

    async function deleteLesson(idx) {
      db.lessons.splice(idx, 1);
      await saveCloudDB();
      addBotMsg('✅ Урок удалён из расписания.');
    }

    async function cmdGrades() {
      addUserMsg('📊 Оценки');
      await loadCloudDB();
      if (!db.grades.length) {
        addBotMsg('В журнале пока нет выставленных оценок.');
        return;
      }
      const sum = db.grades.reduce((acc, g) => acc + Number(g.val), 0);
      const avg = (sum / db.grades.length).toFixed(2);
      const list = db.grades.slice(0, 15).map(g =>
        `• <b>${g.student}</b> — ${g.subject}: <b>${g.val}</b> ${g.comment ? `(${g.comment})` : ''}`
      ).join('<br>');
      addBotMsg(`📊 <b>Журнал оценок</b> (средний балл: <b>${avg}</b>):<br><br>${list}`);
    }

    async function cmdTests() {
      addUserMsg('📝 Тесты (ИИ)');
      await loadCloudDB();
      if (!db.tests.length) {
        addBotMsg(
          'Готовых тестов пока нет. Хочешь, чтобы ИИ прямо сейчас составил тест по любой теме?',
          [[{ label: '✨ Сгенерировать тест через ИИ', cls: 'ai', action: 'promptAITest()' }]]
        );
        return;
      }
      const rows = db.tests.map((t, idx) => ([
        { label: `${t.ai ? '✨' : '📝'} ${t.title} (${t.questions.length} вопр.)`, action: `runTest(${idx})` }
      ]));
      rows.push([{ label: '✨ Создать новый тест с ИИ', cls: 'ai', action: 'promptAITest()' }]);
      addBotMsg('Выбери тест для прохождения или создай новый с помощью ИИ:', rows);
    }

    function promptAITest() {
      const id = 'ai_' + Date.now();
      addBotMsg(
        `✨ <b>ИИ-генератор тестов</b><br>Напиши предмет и тему (например: <i>История: Петр I</i>), а ИИ сам придумает вопросы:<div class="bot-form"><input id="${id}_topic" placeholder="Предмет и тема теста..." /><select id="${id}_cnt"><option value="3">3 вопроса</option><option value="5" selected>5 вопросов</option></select></div>`,
        [[{ label: '🚀 Сгенерировать тест', cls: 'ai', action: `executeAITest('${id}')` }]]
      );
    }

    async function executeAITest(id) {
      const topic = document.getElementById(`${id}_topic`).value.trim();
      const count = parseInt(document.getElementById(`${id}_cnt`).value, 10);
      if (!topic) return alert('Введи предмет и тему!');
      addUserMsg(`Сделай тест: ${topic} (${count} вопр.)`);
      const waitMsg = addBotMsg('⏳ ИИ составляет вопросы и варианты ответов...');

      const prompt = `Составь школьный тест на русском языке на тему "${topic}". Количество вопросов: ${count}. Верни ТОЛЬКО валидный JSON массив без markdown в точном формате: [{"q":"вопрос","options":["правильный ответ","неправильный 1","неправильный 2","неправильный 3"],"ans":0}] где ans всегда 0.`;

      try {
        const resp = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: 'Ты школьный учитель. Отвечай строго чистым JSON массивом.' },
              { role: 'user', content: prompt }
            ],
            model: 'openai',
            jsonMode: true
          })
        });
        const raw = await resp.text();
        const match = raw.match(/\[[\s\S]*\]/);
        if (!match) throw new Error();
        const parsed = JSON.parse(match[0]);
        const questions = parsed.map(item => {
          const correctText = item.options[item.ans || 0];
          const shuffled = [...item.options].sort(() => Math.random() - 0.5);
          return { q: item.q, options: shuffled, ans: shuffled.indexOf(correctText) };
        });
        db.tests.unshift({ title: topic, ai: true, questions });
        await saveCloudDB();
        waitMsg.remove();
        addBotMsg(
          `✅ Тест <b>«${topic}»</b> готов (${questions.length} вопр.) и сохранён для всех учеников!`,
          [[{ label: '▶️ Пройти этот тест сейчас', action: 'runTest(0)' }]]
        );
      } catch (e) {
        waitMsg.remove();
        addBotMsg('❌ ИИ сейчас перегружен, попробуй нажать генерацию ещё раз.');
      }
    }

    // Прохождение теста прямо в чате
    let activeTest = null, qIdx = 0, score = 0;
    function runTest(idx) {
      activeTest = db.tests[idx];
      qIdx = 0; score = 0;
      addUserMsg(`Пройти тест: ${activeTest.title}`);
      sendNextQuestion();
    }

    function sendNextQuestion() {
      if (qIdx >= activeTest.questions.length) {
        const total = activeTest.questions.length;
        const pct = Math.round((score / total) * 100);
        const mark = pct >= 85 ? '5' : pct >= 70 ? '4' : pct >= 50 ? '3' : '2';
        notifyTeacher(`✅ Тест пройден\nУченик: ${userName}\nТест: ${activeTest.title}\nРезультат: ${score}/${total} (Оценка: ${mark})`);
        addBotMsg(
          `🎉 <b>Тест завершён!</b><br>Правильных ответов: <b>${score} из ${total}</b> (${pct}%)<br>Твоя оценка: <b>${mark}</b>`,
          [[{ label: '📝 К списку тестов', action: 'cmdTests()' }]]
        );
        return;
      }
      const q = activeTest.questions[qIdx];
      const qId = 'q_' + Date.now();
      const rows = q.options.map((opt, i) => ([
        { label: opt, action: `answerQuestion('${qId}', ${i}, this)` }
      ]));
      addBotMsg(`<b>Вопрос ${qIdx + 1}/${activeTest.questions.length}:</b><br>${q.q}`, rows);
    }

    function answerQuestion(qId, chosenIdx, btnEl) {
      const wrap = btnEl.closest('.msg-wrap');
      const btns = wrap.querySelectorAll('.inline-btn');
      btns.forEach(b => b.disabled = true);
      const q = activeTest.questions[qIdx];
      if (chosenIdx === q.ans) {
        btnEl.classList.add('correct');
        score++;
      } else {
        btnEl.classList.add('wrong');
        btns[q.ans].classList.add('correct');
      }
      setTimeout(() => { qIdx++; sendNextQuestion(); }, 750);
    }

    // Сдача ДЗ и пропуск
    function cmdSubmitHW() {
      addUserMsg('📤 Сдать ДЗ');
      const id = 'hw_' + Date.now();
      addBotMsg(
        `Заполни форму для отправки домашнего задания:<div class="bot-form"><input id="${id}_name" value="${userName}" placeholder="Фамилия и Имя" /><input id="${id}_subj" placeholder="Предмет (напр. Алгебра)" /><textarea id="${id}_text" rows="3" placeholder="Текст ответа или ссылка на фото..."></textarea></div>`,
        [[{ label: '📨 Отправить учителю', action: `sendHWForm('${id}')` }]]
      );
    }

    async function sendHWForm(id) {
      const name = document.getElementById(`${id}_name`).value.trim() || userName;
      const subj = document.getElementById(`${id}_subj`).value.trim() || 'Общий';
      const text = document.getElementById(`${id}_text`).value.trim();
      if (!text) return alert('Введи текст задания!');
      const time = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      db.submissions.unshift({ type: `ДЗ (${subj})`, name, text, time });
      await saveCloudDB();
      await notifyTeacher(`📥 Новое ДЗ\nУченик: ${name}\nПредмет: ${subj}\n\n${text}`);
      addBotMsg(`✅ Работа по предмету <b>${subj}</b> отправлена учителю!`);
    }

    function cmdSkip() {
      addUserMsg('⚠️ Пропуск урока');
      const id = 'sk_' + Date.now();
      addBotMsg(
        `Укажи причину отсутствия на уроке:<div class="bot-form"><input id="${id}_name" value="${userName}" placeholder="Фамилия и Имя" /><input id="${id}_reason" placeholder="Причина (болезнь, олимпиада...)" /></div>`,
        [[{ label: '⚠️ Предупредить учителя', action: `sendSkipForm('${id}')` }]]
      );
    }

    async function sendSkipForm(id) {
      const name = document.getElementById(`${id}_name`).value.trim() || userName;
      const text = document.getElementById(`${id}_reason`).value.trim();
      if (!text) return alert('Укажи причину!');
      const time = new Date().toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      db.submissions.unshift({ type: 'Пропуск', name, text, time });
      await saveCloudDB();
      await notifyTeacher(`⚠️ Пропуск урока\nУченик: ${name}\nПричина: ${text}`);
      addBotMsg('✅ Уведомление о пропуске передано учителю.');
    }

    // Режим учителя
    function cmdTeacher() {
      addUserMsg('🎓 Режим учителя');
      if (isTeacher) {
        showTeacherMenu();
        return;
      }
      const id = 'pin_' + Date.now();
      addBotMsg(
        `Введи ПИН-код преподавателя:<div class="bot-form"><input id="${id}" type="password" placeholder="ПИН-код" /></div>`,
        [[{ label: '🔓 Войти', action: `checkTeacherPin('${id}')` }]]
      );
    }

    function checkTeacherPin(id) {
      if (document.getElementById(id).value === TEACHER_PIN) {
        isTeacher = true;
        document.getElementById('roleBadge').innerText = 'Учитель';
        showTeacherMenu();
      } else {
        addBotMsg('❌ Неверный ПИН-код.');
      }
    }

    function showTeacherMenu() {
      addBotMsg(
        '🎓 <b>Панель управления учителя</b><br>Выбери действие:',
        [
          [{ label: '✨ Создать тест через ИИ', cls: 'ai', action: 'promptAITest()' }],
          [{ label: '➕ Добавить урок и ДЗ', action: 'teacherAddLessonForm()' }, { label: '🏅 Поставить оценку', action: 'teacherAddGradeForm()' }],
          [{ label: '📥 Сданные работы', action: 'teacherViewSubmissions()' }, { label: '🔔 Привязать мой TG', action: 'bindTeacherTelegram()' }]
        ]
      );
    }

    function teacherAddLessonForm() {
      const id = 'ls_' + Date.now();
      addBotMsg(
        `<b>Новый урок в расписание:</b><div class="bot-form">
          <select id="${id}_cls"><option value="5">5 класс</option><option value="6">6 класс</option><option value="7" selected>7 класс</option><option value="8">8 класс</option><option value="9">9 класс</option><option value="10">10 класс</option><option value="11">11 класс</option></select>
          <select id="${id}_day"><option>Понедельник</option><option>Вторник</option><option>Среда</option><option>Четверг</option><option>Пятница</option><option>Суббота</option></select>
          <input id="${id}_time" placeholder="Время / номер урока (напр. 1 урок, 08:30)" />
          <input id="${id}_topic" placeholder="Предмет и тема" />
          <input id="${id}_task" placeholder="Домашнее задание" />
        </div>`,
        [[{ label: '💾 Сохранить урок', action: `saveLessonForm('${id}')` }]]
      );
    }

    async function saveLessonForm(id) {
      const cls = document.getElementById(`${id}_cls`).value;
      const day = document.getElementById(`${id}_day`).value;
      const time = document.getElementById(`${id}_time`).value.trim();
      const topic = document.getElementById(`${id}_topic`).value.trim();
      const task = document.getElementById(`${id}_task`).value.trim() || 'Без ДЗ';
      if (!topic) return alert('Укажи предмет и тему!');
      db.lessons.push({ cls, day, time, topic, task });
      await saveCloudDB();
      addBotMsg(`✅ Урок <b>${topic}</b> добавлен в расписание ${cls} класса (${day})!`);
    }

    function teacherAddGradeForm() {
      const id = 'gr_' + Date.now();
      addBotMsg(
        `<b>Выставить оценку:</b><div class="bot-form">
          <input id="${id}_st" placeholder="Фамилия и Имя ученика" />
          <input id="${id}_sb" placeholder="Предмет" />
          <select id="${id}_val"><option value="5">5 (Отлично)</option><option value="4">4 (Хорошо)</option><option value="3">3 (Удовл.)</option><option value="2">2 (Неуд.)</option></select>
          <input id="${id}_cm" placeholder="Комментарий (необязательно)" />
        </div>`,
        [[{ label: '🏅 Поставить оценку', action: `saveGradeForm('${id}')` }]]
      );
    }

    async function saveGradeForm(id) {
      const student = document.getElementById(`${id}_st`).value.trim();
      const subject = document.getElementById(`${id}_sb`).value.trim();
      const val = document.getElementById(`${id}_val`).value;
      const comment = document.getElementById(`${id}_cm`).value.trim();
      if (!student || !subject) return alert('Заполни ученика и предмет!');
      db.grades.unshift({ student, subject, val, comment });
      await saveCloudDB();
      addBotMsg(`✅ Оценка <b>${val}</b> (${subject}) выставлена ученику <b>${student}</b>.`);
    }

    async function teacherViewSubmissions() {
      await loadCloudDB();
      if (!db.submissions.length) {
        addBotMsg('Новых сданных работ и сообщений о пропусках пока нет.');
        return;
      }
      const list = db.submissions.slice(0, 15).map(s =>
        `• <b>[${s.type}] ${s.name}</b> (${s.time}):<br>${s.text}`
      ).join('<br><br>');
      addBotMsg(`📥 <b>Последние записи:</b><br><br>${list}`, [[{ label: '🗑 Очистить список', action: 'clearSubmissions()' }]]);
    }

    async function clearSubmissions() {
      db.submissions = [];
      await saveCloudDB();
      addBotMsg('🗑 Список сданных работ очищен.');
    }

    async function bindTeacherTelegram() {
      if (!currentTgUserId) {
        addBotMsg('⚠️ Открой приложение через кнопку в Telegram, чтобы привязать аккаунт.');
        return;
      }
      db.teacherChatId = currentTgUserId;
      await saveCloudDB();
      await notifyTeacher('✅ Уведомления школьного дневника подключены!');
      addBotMsg(`✅ Твой Telegram (ID: ${currentTgUserId}) привязан! Все работы учеников будут приходить в личку.`);
    }

    // Свободный ввод текста внизу чата
    function handleFreeText() {
      const inp = document.getElementById('chatInput');
      const val = inp.value.trim();
      if (!val) return;
      inp.value = '';
      const low = val.toLowerCase();
      if (low.includes('расписан') || low.includes('урок')) return cmdSchedule();
      if (low.includes('оценк')) return cmdGrades();
      if (low.includes('тест')) return cmdTests();
      if (low.includes('учител') || val === TEACHER_PIN) {
        if (val === TEACHER_PIN) {
          addUserMsg('•••••');
          isTeacher = true;
          document.getElementById('roleBadge').innerText = 'Учитель';
          return showTeacherMenu();
        }
        return cmdTeacher();
      }
      addUserMsg(val);
      addBotMsg(
        `Я могу сразу сгенерировать тест по теме <b>«${val}»</b> или открыть нужный раздел:`,
        [
          [{ label: `✨ Сделать тест ИИ: ${val}`, cls: 'ai', action: `quickAITest('${val.replace(/'/g, '')}')` }],
          [{ label: '📅 Расписание', action: 'cmdSchedule()' }, { label: '📤 Сдать ДЗ', action: 'cmdSubmitHW()' }]
        ]
      );
    }

    async function quickAITest(topic) {
      const waitMsg = addBotMsg(`⏳ ИИ генерирует тест на тему «${topic}»...`);
      const prompt = `Составь школьный тест на русском языке на тему "${topic}". Количество вопросов: 5. Верни ТОЛЬКО валидный JSON массив без markdown: [{"q":"вопрос","options":["правильный ответ","неправильный 1","неправильный 2","неправильный 3"],"ans":0}]`;
      try {
        const resp = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              { role: 'system', content: 'Ты школьный учитель. Отвечай строго чистым JSON массивом.' },
              { role: 'user', content: prompt }
            ],
            model: 'openai',
            jsonMode: true
          })
        });
        const raw = await resp.text();
        const match = raw.match(/\[[\s\S]*\]/);
        const parsed = JSON.parse(match[0]);
        const questions = parsed.map(item => {
          const correctText = item.options[item.ans || 0];
          const shuffled = [...item.options].sort(() => Math.random() - 0.5);
          return { q: item.q, options: shuffled, ans: shuffled.indexOf(correctText) };
        });
        db.tests.unshift({ title: topic, ai: true, questions });
        await saveCloudDB();
        waitMsg.remove();
        addBotMsg(`✅ Тест <b>«${topic}»</b> готов!`, [[{ label: '▶️ Начать тест', action: 'runTest(0)' }]]);
      } catch (e) {
        waitMsg.remove();
        addBotMsg('❌ Не удалось создать тест, попробуй ещё раз.');
      }
    }

    cmdStart();
  </script>
</body>
</html>
