<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Школьный Дневник AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #f1f5f9;
      --chat-bg: #e8eef5;
      --bot-msg: rgba(255, 255, 255, 0.92);
      --user-msg: linear-gradient(135deg, #2563eb 0%, #3b82f6 100%);
      --user-text: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --accent-grad: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      --ai-grad: linear-gradient(135deg, #7c3aed 0%, #db2777 50%, #f59e0b 100%);
      --inline-bg: rgba(37, 99, 235, 0.08);
      --inline-text: #1d4ed8;
      --panel: rgba(255, 255, 255, 0.86);
      --border: rgba(148, 163, 184, 0.28);
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }
    body.dark {
      --bg: #090d16;
      --chat-bg: #0b1120;
      --bot-msg: rgba(30, 41, 59, 0.88);
      --user-msg: linear-gradient(135deg, #2563eb 0%, #4f46e5 100%);
      --user-text: #ffffff;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #60a5fa;
      --inline-bg: rgba(96, 165, 250, 0.14);
      --inline-text: #93c5fd;
      --panel: rgba(15, 23, 42, 0.85);
      --border: rgba(148, 163, 184, 0.16);
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--chat-bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
      position: relative;
    }

    /* Живой фоновый градиент (Ambient Orbs) */
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(65px); z-index: 0; pointer-events: none; opacity: 0.45;
      animation: floatOrb 14s ease-in-out infinite alternate;
    }
    .orb-1 { width: 240px; height: 240px; background: #3b82f6; top: -40px; left: -60px; }
    .orb-2 { width: 220px; height: 220px; background: #a855f7; bottom: 80px; right: -50px; animation-delay: -5s; }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(25px, 35px) scale(1.12); }
    }

    /* Экраны входа и ожидания */
    .gate-screen {
      flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center;
      padding: 24px; text-align: center; z-index: 2; overflow-y: auto;
    }
    .gate-card {
      background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border); border-radius: 28px;
      padding: 32px 24px; width: 100%; max-width: 400px;
      box-shadow: var(--shadow);
      animation: popIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes popIn { from { opacity: 0; transform: scale(0.94) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
    .gate-icon {
      width: 74px; height: 74px; border-radius: 24px; background: var(--accent-grad);
      color: #fff; font-size: 34px; display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px; box-shadow: 0 12px 28px rgba(37, 99, 235, 0.35);
    }
    .gate-card h2 { margin: 0 0 8px; font-size: 22px; font-weight: 800; letter-spacing: -0.3px; }
    .gate-card p { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .gate-input {
      width: 100%; padding: 14px 16px; border-radius: 16px; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 15px; margin-bottom: 14px; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .gate-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15); }
    .primary-btn {
      width: 100%; padding: 14px; border-radius: 16px; border: none;
      background: var(--accent-grad); color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.3);
      transition: transform 0.12s;
    }
    .primary-btn:active { transform: scale(0.97); }
    .link-btn {
      background: none; border: none; color: var(--muted); font-size: 13px; font-weight: 600;
      margin-top: 16px; cursor: pointer;
    }
    .status-pill {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(245, 158, 11, 0.12); color: #d97706;
      padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 18px;
    }
    .pulse-dot {
      width: 9px; height: 9px; border-radius: 50%; background: #f59e0b;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.75); } }

    /* Шапка основного приложения */
    header {
      background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--border); padding: 10px 14px 10px; z-index: 10; flex-shrink: 0;
    }
    .top-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
    .bot-info { display: flex; align-items: center; gap: 11px; }
    .avatar {
      width: 40px; height: 40px; border-radius: 14px; background: var(--accent-grad);
      color: #fff; display: flex; align-items: center; justify-content: center; font-size: 19px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.28);
    }
    .bot-title { font-weight: 800; font-size: 15px; letter-spacing: -0.2px; }
    .bot-status { font-size: 12px; color: #10b981; font-weight: 600; display: flex; align-items: center; gap: 5px; }
    .online-dot { width: 7px; height: 7px; border-radius: 50%; background: #10b981; }
    .role-pill {
      font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 20px;
      background: var(--inline-bg); color: var(--inline-text); letter-spacing: 0.2px;
    }

    /* Твои классы наверху */
    .classes-bar {
      display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 2px; scrollbar-width: none;
    }
    .classes-bar::-webkit-scrollbar { display: none; }
    .class-tab {
      padding: 7px 15px; border-radius: 20px; border: 1px solid var(--border);
      background: var(--bg); color: var(--muted); font-size: 13px; font-weight: 700;
      cursor: pointer; white-space: nowrap; transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .class-tab.active {
      background: var(--accent-grad); color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.32); transform: translateY(-1px);
    }

    /* Лента чата */
    #chatFeed {
      flex: 1; overflow-y: auto; padding: 14px 12px 18px; z-index: 2;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg-wrap {
      display: flex; flex-direction: column; max-width: 90%;
      animation: msgSlide 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .msg-wrap.bot { align-self: flex-start; }
    .msg-wrap.user { align-self: flex-end; }
    @keyframes msgSlide { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }

    .bubble {
      padding: 12px 15px; border-radius: 20px; font-size: 14px; line-height: 1.48;
      box-shadow: 0 3px 12px rgba(15, 23, 42, 0.06); word-wrap: break-word;
    }
    .bot .bubble {
      background: var(--bot-msg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border); border-bottom-left-radius: 5px;
    }
    .user .bubble {
      background: var(--user-msg); color: var(--user-text);
      border-bottom-right-radius: 5px; box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
    }
    .msg-time { font-size: 10px; opacity: 0.65; text-align: right; margin-top: 5px; }

    /* Красивые мини-карточки внутри сообщений бота */
    .widget-item {
      background: var(--bg); border: 1px solid var(--border); border-radius: 14px;
      padding: 10px 12px; margin-top: 8px;
    }
    .widget-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .badge-tag {
      font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 8px;
      background: var(--inline-bg); color: var(--inline-text);
    }
    .grade-circle {
      width: 30px; height: 30px; border-radius: 10px; font-weight: 800; font-size: 15px;
      display: flex; align-items: center; justify-content: center; color: #fff;
    }
    .g-5 { background: linear-gradient(135deg, #10b981, #059669); }
    .g-4 { background: linear-gradient(135deg, #3b82f6, #2563eb); }
    .g-3 { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .g-2 { background: linear-gradient(135deg, #ef4444, #dc2626); }

    /* Прогресс-бар в тестах */
    .progress-track {
      width: 100%; height: 6px; background: var(--bg); border-radius: 99px;
      overflow: hidden; margin-bottom: 10px;
    }
    .progress-fill {
      height: 100%; background: var(--ai-grad); border-radius: 99px; transition: width 0.35s ease;
    }
    .explain-box {
      margin-top: 8px; padding: 8px 10px; border-radius: 10px; font-size: 12.5px;
      background: rgba(124, 58, 237, 0.08); border-left: 3px solid #8b5cf6;
    }

    /* Inline-кнопки */
    .inline-kb { display: flex; flex-direction: column; gap: 6px; margin-top: 7px; }
    .inline-row { display: flex; gap: 6px; }
    .inline-btn {
      flex: 1; background: var(--bot-msg); backdrop-filter: blur(10px);
      color: var(--inline-text); border: 1px solid var(--border);
      border-radius: 13px; padding: 10px 11px; font-size: 13px; font-weight: 700;
      cursor: pointer; text-align: center; transition: transform 0.1s, background 0.15s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }
    .inline-btn:active { transform: scale(0.97); }
    .inline-btn.ai {
      background: var(--ai-grad); color: #fff; border: none;
      box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
    }
    .inline-btn.correct { background: #10b981 !important; color: #fff !important; border-color: #10b981 !important; }
    .inline-btn.wrong { background: #ef4444 !important; color: #fff !important; border-color: #ef4444 !important; }

    .bot-form input, .bot-form select, .bot-form textarea {
      width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); margin-top: 8px; font-size: 13.5px; outline: none;
    }

    /* Нижняя панель команд */
    .bottom-dock {
      background: var(--panel); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border-top: 1px solid var(--border); padding: 8px 10px 12px; z-index: 10; flex-shrink: 0;
    }
    .input-bar { display: flex; gap: 8px; margin-bottom: 8px; }
    .input-bar input {
      flex: 1; padding: 10px 15px; border-radius: 22px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); font-size: 14px; outline: none;
    }
    .send-btn {
      width: 40px; height: 40px; border-radius: 50%; border: none;
      background: var(--accent-grad); color: #fff; font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }
    .reply-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .reply-btn {
      background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 12px; padding: 9px 8px; font-size: 13px; font-weight: 700;
      cursor: pointer; text-align: center; transition: transform 0.1s;
    }
    .reply-btn:active { transform: scale(0.97); background: var(--inline-bg); }
    .reply-btn.ai-pill {
      background: linear-gradient(135deg, rgba(124,58,237,0.12), rgba(236,72,153,0.12));
      border-color: rgba(124,58,237,0.3); color: #7c3aed;
    }
    body.dark .reply-btn.ai-pill { color: #c084fc; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- ЭКРАН 1: ВВОД ИМЕНИ И ФАМИЛИИ -->
  <div id="screenRegister" class="gate-screen">
    <div class="gate-card">
      <div class="gate-icon">📘</div>
      <h2>Школьный Дневник</h2>
      <p>Введите ваши <b>Имя и Фамилию</b>, чтобы отправить заявку и получить доступ к своим классам.</p>
      <input id="regFullName" class="gate-input" placeholder="Например: Артём Сорокин" />
      <button class="primary-btn" onclick="submitRegistration()">Отправить заявку</button>
      <button class="link-btn" onclick="openTeacherLoginFromGate()">🎓 Войти как учитель</button>
    </div>
  </div>

  <!-- ЭКРАН 2: ОЖИДАНИЕ ДОБАВЛЕНИЯ В КЛАСС -->
  <div id="screenWaiting" class="gate-screen hidden">
    <div class="gate-card">
      <div class="gate-icon">⏳</div>
      <h2>Заявка на проверке</h2>
      <p id="waitingUserText">Подождите, пока учитель добавит вас в класс.</p>
      <div class="status-pill">
        <span class="pulse-dot"></span>Ожидает добавления в класс
      </div>
      <button class="primary-btn" onclick="checkApprovalStatus()">🔄 Проверить статус</button>
      <button class="link-btn" onclick="resetMyProfile()">Изменить имя и фамилию</button><br/>
      <button class="link-btn" onclick="openTeacherLoginFromGate()">🎓 Войти как учитель</button>
    </div>
  </div>

  <!-- ЭКРАН 3: ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
  <div id="screenApp" class="hidden" style="display:flex; flex-direction:column; height:100vh;">
    <header>
      <div class="top-row">
        <div class="bot-info">
          <div class="avatar">📘</div>
          <div>
            <div class="bot-title" id="headerUserName">Дневник</div>
            <div class="bot-status"><span class="online-dot"></span><span id="syncStatus">в сети • AI подключён</span></div>
          </div>
        </div>
        <span class="role-pill" id="roleBadge">Ученик</span>
      </div>
      <!-- ТВОИ КЛАССЫ НАВЕРХУ -->
      <div class="classes-bar" id="myClassesBar"></div>
    </header>

    <div id="chatFeed"></div>

    <div class="bottom-dock">
      <div class="input-bar">
        <input id="chatInput" placeholder="Спроси ИИ-репетитора или введи команду..." onkeydown="if(event.key==='Enter') handleFreeText()" />
        <button class="send-btn" onclick="handleFreeText()">➤</button>
      </div>
      <div class="reply-grid">
        <button class="reply-btn" onclick="cmdSchedule()">📅 Расписание и ДЗ</button>
        <button class="reply-btn" onclick="cmdGrades()">📊 Мои оценки</button>
        <button class="reply-btn ai-pill" onclick="cmdTests()">✨ Тесты и ИИ</button>
        <button class="reply-btn" onclick="cmdSubmitHW()">📤 Сдать ДЗ</button>
        <button class="reply-btn" onclick="cmdSkip()">⚠️ Пропуск урока</button>
        <button class="reply-btn" onclick="cmdTeacher()">🎓 Учитель</button>
      </div>
    </div>
  </div>

  <script>
    const DB_URL = "https://chinese-diary-1ea47-default-rtdb.firebaseio.com";
    const BOT_TOKEN = "9227625709:AAEEV7aCPq3vW_mb7GmAVi_hpEOQuOFSuDQ";
    const TEACHER_PIN = "43415";

    const tg = window.Telegram && window.Telegram.WebApp;
    let currentTgUserId = null;

    function haptic(type = 'light') {
      try {
        if (tg && tg.HapticFeedback) {
          if (type === 'success' || type === 'error') tg.HapticFeedback.notificationOccurred(type);
          else tg.HapticFeedback.impactOccurred(type);
        }
      } catch (e) {}
    }

    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.colorScheme === 'dark') document.body.classList.add('dark');
      if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
        currentTgUserId = tg.initDataUnsafe.user.id;
      }
    }

    let myStudentId = localStorage.getItem('diary_student_id');
    if (!myStudentId) {
      myStudentId = currentTgUserId ? String(currentTgUserId) : 'st_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
      localStorage.setItem('diary_student_id', myStudentId);
    }

    let db = {
      classes: [],
      students: [],
      lessons: [],
      grades: [],
      tests: [],
      submissions: [],
      teacherChatId: null
    };

    let isTeacher = false;
    let activeClassId = null;
    let myProfile = null;

    async function loadCloudDB() {
      const stEl = document.getElementById('syncStatus');
      if (stEl) stEl.innerText = 'синхронизация...';
      try {
        const res = await fetch(`${DB_URL}/diary_v2.json`);
        const data = await res.json();
        if (data) {
          db.classes = data.classes || [];
          db.students = data.students || [];
          db.lessons = data.lessons || [];
          db.grades = data.grades || [];
          db.tests = data.tests || [];
          db.submissions = data.submissions || [];
          db.teacherChatId = data.teacherChatId || null;
        }
        if (stEl) stEl.innerText = 'в сети • AI подключён';
      } catch (e) {
        if (stEl) stEl.innerText = 'ошибка сети';
      }
    }

    async function saveCloudDB() {
      await fetch(`${DB_URL}/diary_v2.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(db)
      });
    }

    async function notifyTeacher(text) {
      if (!db.teacherChatId) return;
      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: db.teacherChatId, text })
        });
      } catch (e) {}
    }

    async function initApp() {
      await loadCloudDB();
      if (isTeacher) {
        openMainApp();
        return;
      }
      myProfile = db.students.find(s => s.id === myStudentId);
      if (!myProfile) {
        showScreen('screenRegister');
      } else if (!myProfile.classes || myProfile.classes.length === 0) {
        document.getElementById('waitingUserText').innerHTML = `<b>${myProfile.name}</b>, ваша заявка отправлена учителю. Ожидайте добавления в класс.`;
        showScreen('screenWaiting');
      } else {
        openMainApp();
      }
    }

    function showScreen(id) {
      ['screenRegister', 'screenWaiting', 'screenApp'].forEach(s => {
        const el = document.getElementById(s);
        if (s === id) el.classList.remove('hidden');
        else el.classList.add('hidden');
      });
    }

    async function submitRegistration() {
      haptic('medium');
      const name = document.getElementById('regFullName').value.trim();
      if (name.length < 3) return alert('Введите ваши Имя и Фамилию!');
      await loadCloudDB();
      const existing = db.students.find(s => s.id === myStudentId);
      if (existing) existing.name = name;
      else db.students.push({ id: myStudentId, name, classes: [], tgId: currentTgUserId });
      await saveCloudDB();
      await notifyTeacher(`🆕 Новая заявка в дневник:\n👤 ${name}\n\nОткройте «Учитель» -> «Ученики», чтобы добавить в класс.`);
      initApp();
    }

    async function checkApprovalStatus() {
      haptic('light');
      await initApp();
      if (myProfile && (!myProfile.classes || myProfile.classes.length === 0)) {
        alert('Учитель пока ещё не добавил вас в класс. Попробуйте проверить через минуту!');
      }
    }

    async function resetMyProfile() {
      await loadCloudDB();
      db.students = db.students.filter(s => s.id !== myStudentId);
      await saveCloudDB();
      showScreen('screenRegister');
    }

    function openTeacherLoginFromGate() {
      const pin = prompt('Введите ПИН-код учителя:');
      if (pin === TEACHER_PIN) {
        haptic('success');
        isTeacher = true;
        openMainApp();
      } else if (pin !== null) {
        haptic('error');
        alert('❌ Неверный ПИН-код');
      }
    }

    function openMainApp() {
      showScreen('screenApp');
      document.getElementById('roleBadge').innerText = isTeacher ? '🎓 Учитель' : '🎒 Ученик';
      document.getElementById('headerUserName').innerText = isTeacher ? 'Панель учителя' : (myProfile ? myProfile.name : 'Ученик');
      renderTopClasses();

      if (document.getElementById('chatFeed').children.length === 0) {
        const activeCls = db.classes.find(c => c.id === activeClassId);
        const clsGreeting = activeCls ? `Активный класс: <b>${activeCls.name}</b>.` : 'Классы пока не созданы.';
        addBotMsg(
          `Привет${myProfile ? ', <b>' + myProfile.name + '</b>' : ''}! 👋<br>${clsGreeting}<br>Выбирай свои классы наверху, задавай любые вопросы ИИ-репетитору в поле снизу или жми на кнопки:`,
          isTeacher
            ? [
                [{ label: '🎓 Меню управления учителя', action: 'showTeacherMenu()' }],
                [{ label: '✨ Сделать тест через ИИ', cls: 'ai', action: 'promptAITest()' }]
              ]
            : [
                [{ label: '📅 Расписание и ДЗ', action: 'cmdSchedule()' }, { label: '✨ Тесты с ИИ', cls: 'ai', action: 'cmdTests()' }],
                [{ label: '📊 Мои оценки', action: 'cmdGrades()' }, { label: '📤 Сдать ДЗ', action: 'cmdSubmitHW()' }]
              ]

    let activeTest = null, qIdx = 0, score = 0;
    function runTest(idx) {
      haptic('medium');
      activeTest = db.tests[idx];
      qIdx = 0; score = 0;
      addUserMsg(`Пройти тест: ${activeTest.title}`);
      sendNextQuestion();
    }

    function sendNextQuestion() {
      if (qIdx >= activeTest.questions.length) {
        const total = activeTest.questions.length;
        const pct = Math.round((score / total) * 100);
        const mark = pct >= 85 ? '5' : pct >= 70 ? '4' : pct >= 50 ? '3' : '2';
        const stName = myProfile ? myProfile.name : 'Учитель';
        haptic('success');
        notifyTeacher(`✅ Тест пройден\nУченик: ${stName}\nТест: ${activeTest.title}\nРезультат: ${score}/${total} (Оценка: ${mark})`);
        addBotMsg(
          `<div style="text-align:center; padding:6px 0;">
            <div style="font-size:36px;">🏆</div>
            <div style="font-size:17px; font-weight:800; margin:4px 0;">Тест завершён!</div>
            <div style="color:var(--muted); font-size:13px;">Правильных ответов: <b>${score} из ${total}</b> (${pct}%)</div>
            <div class="grade-circle g-${mark}" style="width:46px; height:46px; font-size:22px; margin:10px auto 0;">${mark}</div>
          </div>`,
          [[{ label: '✨ К списку тестов', action: 'cmdTests()' }]]
        );
        return;
      }
      const q = activeTest.questions[qIdx];
      const progressPct = Math.round((qIdx / activeTest.questions.length) * 100);
      const rows = q.options.map((opt, i) => ([
        { label: opt, action: `answerQuestion(${i}, this)` }
      ]));
      addBotMsg(
        `<div class="progress-track"><div class="progress-fill" style="width:${progressPct}%"></div></div>
         <div style="font-size:11.5px; color:var(--muted); margin-bottom:4px;">Вопрос ${qIdx + 1} из ${activeTest.questions.length}</div>
         <div style="font-weight:700; font-size:15px;">${q.q}</div>`,
        rows
      );
    }

    function answerQuestion(chosenIdx, btnEl) {
      const wrap = btnEl.closest('.msg-wrap');
      const btns = wrap.querySelectorAll('.inline-btn');
      btns.forEach(b => b.disabled = true);
      const q = activeTest.questions[qIdx];
      if (chosenIdx === q.ans) {
        haptic('success');
        btnEl.classList.add('correct');
        score++;
      } else {
        haptic('error');
        btnEl.classList.add('wrong');
        btns[q.ans].classList.add('correct');
      }
      if (q.exp) {
        const bubble = wrap.querySelector('.bubble');
        bubble.insertAdjacentHTML('beforeend', `<div class="explain-box">💡 ${q.exp}</div>`);
        scrollToBottom();
      }
      setTimeout(() => { qIdx++; sendNextQuestion(); }, q.exp ? 1600 : 800);
    }

    async function callPollinationsAI(systemPrompt, userPrompt, jsonMode = false) {
      const resp = await fetch('https://text.pollinations.ai/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: userPrompt }
          ],
          model: 'openai',
          jsonMode
        })
      });
      if (!resp.ok) throw new Error('AI HTTP ' + resp.status);
      return await resp.text();
    }

    async function executeAITest(id) {
      const classId = document.getElementById(`${id}_cls`).value;
      const topic = document.getElementById(`${id}_topic`).value.trim();
      const level = document.getElementById(`${id}_lvl`).value;
      const count = parseInt(document.getElementById(`${id}_cnt`).value, 10);
      if (!topic) return alert('Введите предмет и тему!');
      haptic('medium');
      const waitMsg = addBotMsg(`✨ ИИ составляет тест (${count} вопр., уровень: ${level})...`);

      const sys = 'Ты опытный школьный методист. Возвращай ТОЛЬКО валидный JSON-массив объектов без markdown и лишнего текста.';
      const prompt = `Составь тест на русском языке на тему "${topic}". Уровень сложности: ${level}. Количество вопросов: ${count}. Формат каждого объекта: {"q":"текст вопроса","options":["правильный ответ","неправильный вариант 1","неправильный вариант 2","неправильный вариант 3"],"ans":0,"exp":"краткое пояснение в 1 предложение, почему этот ответ верный"}. Поле ans всегда равно 0.`;

      try {
        const raw = await callPollinationsAI(sys, prompt, true);
        const match = raw.match(/\[[\s\S]*\]/);
        if (!match) throw new Error('No JSON array');
        const parsed = JSON.parse(match[0]);
        const questions = parsed.map(item => {
          const correctText = item.options[item.ans || 0];
          const shuffled = [...item.options].sort(() => Math.random() - 0.5);
          return {
            q: item.q,
            options: shuffled,
            ans: shuffled.indexOf(correctText),
            exp: item.exp || ''
          };
        });
        db.tests.unshift({ classId, title: topic, ai: true, questions });
        await saveCloudDB();
        waitMsg.remove();
        haptic('success');
        addBotMsg(
          `✅ Тест <b>«${topic}»</b> готов (${questions.length} вопросов с пояснениями ИИ)!`,
          [[{ label: '▶️ Пройти тест сейчас', cls: 'ai', action: 'runTest(0)' }]]
        );
      } catch (e) {
        waitMsg.remove();
        haptic('error');
        addBotMsg('❌ ИИ сейчас занят, нажмите кнопку генерации ещё раз.');
      }
    }

          <select id="${id}_st">${stOpts}</select>
          <input id="${id}_sb" placeholder="Предмет" />
          <select id="${id}_val"><option value="5">5 (Отлично)</option><option value="4">4 (Хорошо)</option><option value="3">3 (Удовл.)</option><option value="2">2 (Неуд.)</option></select>
          <input id="${id}_cm" placeholder="Комментарий (напр. Контрольная)" />
        </div>`,
        [[{ label: '🏅 Поставить', action: `saveGradeForm('${id}')` }]]
      );
    }

    async function saveGradeForm(id) {
      const studentId = document.getElementById(`${id}_st`).value;
      const st = db.students.find(s => s.id === studentId);
      const subject = document.getElementById(`${id}_sb`).value.trim();
      const val = document.getElementById(`${id}_val`).value;
      const comment = document.getElementById(`${id}_cm`).value.trim();
      if (!st || !subject) return alert('Укажите предмет!');
      haptic('success');
      db.grades.unshift({ studentId, studentName: st.name, subject, val, comment });
      await saveCloudDB();
      addBotMsg(`✅ Оценка <b>${val}</b> (${subject}) поставлена ученику <b>${st.name}</b>.`);
    }

    async function teacherViewSubmissions() {
      await loadCloudDB();
      if (!db.submissions.length) return addBotMsg('Сданных работ пока нет.');
      const list = db.submissions.slice(0, 15).map(s =>
        `<div class="widget-item"><div class="widget-header"><span class="badge-tag">${s.type}</span><span style="font-size:11px; color:var(--muted);">${s.time}</span></div><div style="font-weight:700;">${s.name} (${s.className})</div><div style="font-size:13px; margin-top:3px;">${s.text}</div></div>`
      ).join('');
      addBotMsg(`📥 <b>Последние записи:</b>${list}`, [[{ label: '🗑 Очистить', action: 'clearSubmissions()' }]]);
    }

    async function clearSubmissions() {
      db.submissions = [];
      await saveCloudDB();
      addBotMsg('🗑 Список очищен.');
    }

    async function bindTeacherTelegram() {
      if (!currentTgUserId) return addBotMsg('⚠️ Откройте приложение из Telegram.');
      db.teacherChatId = currentTgUserId;
      await saveCloudDB();
      await notifyTeacher('✅ Уведомления дневника подключены!');
      haptic('success');
      addBotMsg('✅ Ваш Telegram привязан!');
    }

    // --- УМНЫЙ ИИ-РЕПЕТИТОР В СВОБОДНОМ ВВОДЕ ---
    async function handleFreeText() {
      const inp = document.getElementById('chatInput');
      const val = inp.value.trim();
      if (!val) return;
      inp.value = '';
      haptic('light');

      if (val === TEACHER_PIN) {
        addUserMsg('•••••');
        isTeacher = true;
        document.getElementById('roleBadge').innerText = '🎓 Учитель';
        document.getElementById('headerUserName').innerText = 'Панель учителя';
        renderTopClasses();
        return showTeacherMenu();
      }

      addUserMsg(val);
      const low = val.toLowerCase();
      if (low === 'расписание' || low === 'уроки') return cmdSchedule();
      if (low === 'оценки') return cmdGrades();
      if (low === 'тесты') return cmdTests();

      const waitMsg = addBotMsg('✨ ИИ-репетитор думает...');
      try {
        const reply = await callPollinationsAI(
          'Ты дружелюбный и умный школьный ИИ-помощник в электронном дневнике. Отвечай кратко, понятно и по делу на русском языке (используй HTML-теги <b> и <br> для красивого оформления).',
          val,
          false
        );
        waitMsg.remove();
        const safeTopic = val.replace(/'/g, '').slice(0, 45);
        addBotMsg(reply, [
          [{ label: `✨ Создать тест по теме «${safeTopic}»`, cls: 'ai', action: `quickAITest('${safeTopic}')` }]
        ]);
      } catch (e) {
        waitMsg.remove();
        addBotMsg('Используйте кнопки меню ниже или попробуйте задать вопрос ещё раз.');
      }
    }

    async function quickAITest(topic) {
      const waitMsg = addBotMsg(`✨ ИИ генерирует тест на тему «${topic}»...`);
      const sys = 'Ты школьный методист. Возвращай ТОЛЬКО валидный JSON-массив без markdown.';
      const prompt = `Составь школьный тест на русском языке на тему "${topic}". Количество вопросов: 5. Формат: [{"q":"вопрос","options":["правильный ответ","неправильный 1","неправильный 2","неправильный 3"],"ans":0,"exp":"краткое пояснение"}]`;
      try {
        const raw = await callPollinationsAI(sys, prompt, true);
        const match = raw.match(/\[[\s\S]*\]/);
        const parsed = JSON.parse(match[0]);
        const questions = parsed.map(item => {
          const correctText = item.options[item.ans || 0];
          const shuffled = [...item.options].sort(() => Math.random() - 0.5);
          return { q: item.q, options: shuffled, ans: shuffled.indexOf(correctText), exp: item.exp || '' };
        });
        db.tests.unshift({ classId: activeClassId || '', title: topic, ai: true, questions });
        await saveCloudDB();
        waitMsg.remove();
        haptic('success');
        addBotMsg(`✅ Тест <b>«${topic}»</b> готов!`, [[{ label: '▶️ Пройти тест', cls: 'ai', action: 'runTest(0)' }]]);
      } catch (e) {
        waitMsg.remove();
        addBotMsg('❌ Не удалось создать тест, попробуйте ещё раз.');
      }
    }

    initApp();
  </script>
</body>
</html>
